# ------------------------------------------------------------------
# Font Settings
# ------------------------------------------------------------------
# Use a Nerd Font for cool icons and glyphs
font_family      "Hack Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0


# ------------------------------------------------------------------
# Terminal Layout & Appearance
# ------------------------------------------------------------------
# Window padding
window_padding_width 10

# The shape of the cursor
cursor_shape beam

# ------------------------------------------------------------------
# Color Theme (DO NOT EDIT MANUALLY)
# ------------------------------------------------------------------
# This line loads the theme generated by pywal.
# Place it at the end of the file.
include ~/.cache/wal/colors-kitty.conf
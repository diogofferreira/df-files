# Start waybar
exec-once = bash -c "sleep 2 && waybar"

# Load Wallpaper
#exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh
exec-once = swww-daemon
exec-once = swww img ~/Pictures/bg.jpg && wal -a 80 -i ~/Pictures/bg.jpg

# Startup apps
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hyprctl dispatch exec "[workspace 2] thunderbird"
exec-once = bash -c "sleep 2 && hyprctl dispatch exec '[workspace 2] microsoft-teams'"

# Load Notification Daemon
#exec-once = swaync

# Load GTK settings
#exec-once = ~/.config/hypr/scripts/gtk.sh

# Using hypridle to start hyprlock
#exec-once = hypridle

# Load cliphist history
#exec-once = wl-paste --watch cliphist store

# Autostart ML4W App
#exec-once = ~/.config/ml4w/scripts/ml4w-autostart.sh

# Start autostart cleanup
#exec-once = ~/.config/hypr/scripts/cleanup.sh

# Load configuration from ML4W Hyprland Settings App
#xec = ~/.config/com.ml4w.hyprlandsettings/hyprctl.sh

# Dock
#exec-once = ~/.config/nwg-dock-hyprland/launch.sh

